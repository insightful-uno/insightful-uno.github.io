<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="../assets/logo.webp">
<title>Walk with Red</title>
<meta name="description" content="A short pixel walk through four Red Man comics by Insightful.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#1A1817; --soft:#8A8580; --line:#ECE9E5; --paper:#F7F4EE; --red:#E8271A; --pee:#F3D23B;
  --sans:"Manrope","Helvetica Neue",Arial,sans-serif; --display:"Anton","Impact",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;letter-spacing:.03em}
body{padding:0 clamp(12px,3vw,40px) env(safe-area-inset-bottom,0px);min-height:100svh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
a{color:inherit}
.label{font-size:12px;font-weight:400;letter-spacing:.18em;text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;gap:12px}
.top a{text-decoration:none}
.top a:hover{color:var(--red)}
main{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:16px}

#stage{position:relative;width:min(100%, calc((100svh - 150px) * 16 / 9));aspect-ratio:16/9;background:#111;outline:2px solid var(--ink);overflow:hidden;touch-action:none;container-type:inline-size}
body.touch #stage{width:min(100%, calc((100svh - 250px) * 16 / 9))}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block}

/* overlays */
.ov{position:absolute;pointer-events:none}
#hud{inset:0 0 auto 0;display:flex;justify-content:space-between;padding:2.2cqw 2.6cqw;font-size:max(10px,1.5cqw);font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 0 rgba(0,0,0,.6)}
#hud .drop{display:inline-block;width:.8em;height:1em;background:var(--pee);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;vertical-align:-.12em;margin-right:.5em;box-shadow:0 0 0 1px var(--ink)}
#caption{top:7cqw;left:2.6cqw;max-width:44%;background:var(--paper);border:2px solid var(--ink);padding:.6em .8em;font-size:max(11px,1.7cqw);font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s}
#caption.on{opacity:1;transform:none}
.bubble{position:absolute;left:0;top:0;width:max-content;max-width:min(270px,48cqw);background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:22px;padding:.6em .95em;font-size:max(12px,1.55cqw);font-weight:500;line-height:1.35;letter-spacing:.01em;box-shadow:3px 3px 0 var(--ink);white-space:normal;text-align:left;opacity:0;transform:translate(-50%,-100%)}
.bubble::before,.bubble::after{content:"";position:absolute;width:0;height:0;border-style:solid;left:var(--tail,50%)}
.bubble::before{bottom:-17px;margin-left:-6px;border-width:17px 4px 0 10px;border-color:var(--ink) transparent transparent transparent}
.bubble::after{bottom:-11px;margin-left:-3px;border-width:12px 3px 0 7px;border-color:#fff transparent transparent transparent}
.bubble.on{opacity:1;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.bubble.short{font-weight:700;letter-spacing:.04em}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.4) rotate(-6deg);opacity:0}to{transform:translate(-50%,-100%);opacity:1}}
#title{inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12cqw;letter-spacing:.02em;color:var(--paper);-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill;text-shadow:.6cqw .6cqw 0 var(--ink);opacity:0;transform:scale(.96);transition:opacity .35s,transform .35s}
#title.on{opacity:1;transform:none}
#prompt{transform:translate(-50%,-100%);background:var(--red);color:#fff;font-size:max(10px,1.3cqw);font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:.3em .6em;opacity:0;transition:opacity .2s;border:2px solid var(--ink)}
#prompt.on{opacity:1}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(247,244,238,.96);color:var(--ink);padding:4cqw;gap:1.6cqw;pointer-events:auto}
.screen.on{display:flex}
.screen h1{font-family:var(--display);font-weight:400;font-size:9cqw;line-height:.95;margin:0;letter-spacing:.01em}
.screen h1 span{color:var(--red)}
.screen p{margin:0;font-size:max(12px,1.8cqw);line-height:1.5;max-width:60ch}
.screen .keys{font-size:max(10px,1.35cqw);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.screen .keys b{color:var(--ink);font-weight:700}
.btn{font:inherit;font-size:max(11px,1.4cqw);font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;padding:.9em 1.4em;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:hover{background:var(--red);color:#fff;box-shadow:none}
.row{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}
.blinky{animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}

#look{background:rgba(20,17,15,.94);flex-direction:row;gap:1.6cqw;padding:3cqw}
#look .lk-frame{height:88%;aspect-ratio:1;outline:3px solid var(--paper);background:#222;touch-action:pan-y;overflow:hidden;flex:none}
#look img{width:100%;height:100%;object-fit:cover;transition:opacity .15s;pointer-events:none}
#look img.fade{opacity:0}
.lk-arrow{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:max(36px,4.6cqw);height:max(36px,4.6cqw);font-size:max(13px,1.6cqw);cursor:pointer;flex:none;padding:0}
.lk-arrow:hover{background:var(--red);color:#fff}
.lk-arrow:disabled{opacity:.25;cursor:default;background:var(--paper);color:var(--ink)}
.lk-close{position:absolute;top:1.6cqw;right:1.8cqw;background:none;border:0;color:var(--paper);font-size:max(26px,3.6cqw);line-height:1;cursor:pointer;padding:.2em}
.lk-close:hover{color:var(--red)}
#look .dots{display:flex;flex-wrap:wrap;gap:5px;max-width:100%}
#look .dots i{width:7px;height:7px;background:#555;display:block}
#look .dots i.on{background:var(--red)}
#look .meta{color:var(--paper);text-align:left;display:flex;flex-direction:column;gap:1.2cqw;width:24%;margin-left:1.4cqw}
#look .meta h2{font-family:var(--display);font-weight:400;font-size:5cqw;margin:0;line-height:1}
#look .meta .label{color:#bbb;font-size:max(10px,1.3cqw)}
#look .btn{background:var(--paper);color:var(--ink)}
#look .btn:hover{background:var(--red);color:#fff}

/* touch controls */
#touch{display:none;width:min(100%,900px);justify-content:space-between;align-items:center;gap:10px;touch-action:none}
body.touch #touch{display:flex}
#touch .grp{display:flex;gap:10px;align-items:center}
.tb{width:66px;height:66px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font:700 13px/1 var(--sans);letter-spacing:.1em;color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb.arrow{font-size:22px}
.tb.down{background:var(--ink);color:var(--paper)}
.tb.pee{background:var(--pee)}
.tb.hit{background:var(--red);color:#fff}
#stage.trip #screen{animation:trip 2.6s linear infinite}
@keyframes trip{0%{filter:hue-rotate(0deg) saturate(1.5);transform:none}25%{transform:skewX(1.2deg) scale(1.01)}50%{filter:hue-rotate(180deg) saturate(2)}75%{transform:skewX(-1.2deg) scale(1.01)}100%{filter:hue-rotate(360deg) saturate(1.5);transform:none}}
@media (prefers-reduced-motion:reduce){#stage.trip #screen{animation:none;filter:hue-rotate(90deg) saturate(1.6)}}
.tb.pee span{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.tb small{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.tb.look{width:auto;border-radius:999px;padding:0 18px;height:44px;background:var(--red);color:#fff;opacity:.25}
.tb.look.ready{opacity:1}
#keyhint{color:var(--soft)}
body.touch #keyhint{display:none}
@media (max-width:520px){.tb{width:56px;height:56px}.tb.look{height:40px;padding:0 12px}}
</style>
</head>
<body>
<header class="top">
  <a class="label" href="../">&larr; Insightful</a>
  <span class="label">Walk with Red</span>
</header>
<main>
  <div id="stage">
    <canvas id="screen" aria-label="Walk with Red game"></canvas>
    <div id="hud" class="ov"><span id="world">Pink Taxi</span><span><i class="drop"></i><span id="score"></span></span></div>
    <div id="caption" class="ov"></div>
    <div id="b0" class="ov bubble"></div>
    <div id="b1" class="ov bubble"></div>
    <div id="prompt" class="ov">Look</div>
    <div id="title" class="ov"></div>

    <div id="look" class="screen" role="dialog" aria-label="Comic viewer">
      <button class="lk-close" id="lookClose" aria-label="Close">&times;</button>
      <button class="lk-arrow" id="lookPrev" aria-label="Previous panel">&#9664;</button>
      <div class="lk-frame" id="lookFrame"><img id="lookImg" alt="" draggable="false"></div>
      <button class="lk-arrow" id="lookNext" aria-label="Next panel">&#9654;</button>
      <div class="meta">
        <h2 id="lookTitle"></h2>
        <span class="label" id="lookNum"></span>
        <div class="dots" id="lookDots"></div>
        <button class="btn" id="lookBack">Keep walking</button>
      </div>
    </div>

    <div id="start" class="screen on">
      <h1>Walk with <span>Red</span></h1>
      <p>A short walk through four comics. No fighting. Just keep moving.</p>
      <p class="keys" id="startKeys"><b>&larr; &rarr;</b> walk &nbsp; <b>&uarr;</b> jump &nbsp; <b>&darr;</b> duck &nbsp; <b>F</b> hit / throw &nbsp; <b>P</b> pee &nbsp; <b>L</b> look at a panel</p>
      <button class="btn" id="go">Start walking</button>
      <span class="label blinky" id="loading">Loading the comics</span>
    </div>

    <div id="end" class="screen">
      <h1>The <span>End</span></h1>
      <p id="endStats"></p>
      <div class="row">
        <button class="btn" id="again">Walk again</button>
        <a class="btn alt" href="../#comics">Read the comics</a>
      </div>
    </div>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="grp">
      <button class="tb arrow" data-k="left">&#9664;</button>
      <button class="tb arrow" data-k="right">&#9654;</button>
      <button class="tb pee" data-k="pee"><span>Pee<small>hold</small></span></button>
    </div>
    <button class="tb look" data-k="look" id="lookBtn">Look</button>
    <div class="grp">
      <button class="tb" data-k="duck">Duck</button>
      <button class="tb hit" data-k="atk">Hit</button>
      <button class="tb" data-k="jump">Jump</button>
    </div>
  </div>
  <p class="label" id="keyhint">&larr; &rarr; walk &middot; &uarr; jump &middot; &darr; duck &middot; F hit/throw &middot; P pee &middot; L look</p>
</main>

function sprite(rows) {
  const h = rows.length, w = rows[0].length, c = document.createElement("canvas");
  c.width = w + 2; c.height = h + 2; const x = c.getContext("2d");
  const f = (i, j) => j >= 0 && j < h && i >= 0 && i < w && rows[j][i] !== ".";
  for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
    if (f(i, j)) { x.fillStyle = PAL[rows[j][i]]; x.fillRect(i + 1, j + 1, 1, 1); }
    else if (f(i + 1, j) || f(i - 1, j) || f(i, j + 1) || f(i, j - 1)) { x.fillStyle = C.ink; x.fillRect(i + 1, j + 1, 1, 1); }
  }
  return c;
}

function pixelate(img, n) {
  let s = img.naturalWidth || 1400, cur = document.createElement("canvas");
  cur.width = cur.height = s; cur.getContext("2d").drawImage(img, 0, 0, s, s);
  while (s / 2 >= n * 1.5) { s = Math.round(s / 2); const t = document.createElement("canvas"); t.width = t.height = s; const tc = t.getContext("2d"); tc.imageSmoothingQuality = "high"; tc.drawImage(cur, 0, 0, s, s); cur = t; }
  const o = document.createElement("canvas"); o.width = o.height = n; const oc = o.getContext("2d"); oc.imageSmoothingQuality = "high"; oc.drawImage(cur, 0, 0, n, n);
  try { const d = oc.getImageData(0, 0, n, n), a = d.data, q = v => Math.round(v / 255 * 6) / 6 * 255;
    for (let i = 0; i < a.length; i += 4) { a[i] = q(a[i]); a[i + 1] = q(a[i + 1]); a[i + 2] = q(a[i + 2]); }
    oc.putImageData(d, 0, 0); } catch (e) { /* file:// preview, skip posterize */ }
  return o;
}
function loadPanel(num) {
  return new Promise(res => {
    const im = new Image(); im.decoding = "async";
    im.onload = () => { IMG[num] = { full: im.src, lv: [pixelate(im, 12), pixelate(im, 24), pixelate(im, 62)] }; res(); };
    im.onerror = () => res();
    im.src = `../assets/comic-${num}.jpg`;
  });
}

  if ($("look").classList.contains("on")) {
    if (e.metaKey || e.ctrlKey) return; e.preventDefault();
    if (e.code === "ArrowRight" || e.code === "KeyD") showPanel(LK.n + 1);
    else if (e.code === "ArrowLeft" || e.code === "KeyA") showPanel(LK.n - 1);
    else if (["Escape", "KeyL", "Enter", "Space"].includes(e.code)) closeLook();
    return; }
  if ($("start").classList.contains("on") && (e.code === "Enter" || e.code === "Space")) { start(); e.preventDefault(); return; }
  if (e.code === "KeyL" || e.code === "Enter") { openLook(); e.preventDefault(); return; }
  const k = MAP[e.code]; if (!k) return;
  e.preventDefault();
  if (k === "jump" && !K.jump && !e.repeat) jumpEdge = true;
  if (k === "atk" && !K.atk && !e.repeat) atkEdge = true;
  K[k] = true;
});
addEventListener("keyup", e => { const k = MAP[e.code]; if (k) K[k] = false; });
addEventListener("blur", () => { for (const k in K) K[k] = false; });

    if (!S.running && $("start").classList.contains("on")) start();

  const up = e => { b.classList.remove("down"); if (k !== "look") K[k] = false; };
  b.addEventListener("pointerdown", down);

});

/* ============ update ============ */
const SPEED = 70, GRAV = 820, JUMP = 265;
function hitbox(p) { return p.duck ? { l: p.x - 6, r: p.x + 6, b: p.y, t: p.y + 12 } : { l: p.x - 3, r: p.x + 3, b: p.y, t: p.y + 31 }; }
const overlap = (a, o) => a.r > o.x + 1 && a.l < o.x + o.w - 1 && a.t > o.y + 1 && a.b < o.y + o.h - 1;
const TOUGH = { taxi: "HONK!", fire: "hot hot hot" };   // can't be swatted away
function fling(o, dir) {
  if (TOUGH[o.type]) { if (!o.honk || S.t - o.honk > 1) { o.honk = S.t; say(TOUGH[o.type], o.x + o.w / 2, o.y + o.h + 8, 0.9); } return false; }
  o.flung = true; o.vx = 170 * dir; o.vy = 150; o.active = true;
  S.fx.push({ kind: "pow", x: o.x + o.w / 2, y: o.y + o.h / 2, t: 0, life: .25 });
  return true;
}

function update(dt) {
  const p = S.p; S.t += dt;
  // controls
  p.pee = K.pee && p.onG && !K.duck && p.kb <= 0;
  p.peeT = p.pee ? p.peeT + dt : 0;
  p.duck = K.duck && p.onG && !p.pee;
  let vx = 0;
  if (p.kb > 0) { p.kb -= dt; vx = -110; }
  else if (!p.pee) {
    const spd = p.duck ? SPEED * 0.45 : SPEED;
    if (K.right) { vx += spd; p.face = 1; }
    if (K.left) { vx -= spd; p.face = -1; }
  }
  if (jumpEdge && p.onG && !p.pee) { p.vy = JUMP; p.onG = false; p.duck = false; }
  jumpEdge = false;
  // hit / throw
  if (atkEdge && !p.pee && p.atk <= 0 && p.kb <= 0) {
    p.atk = 0.28; p.duck = false;
    if (p.hold === "shroom") { p.hold = null; p.threw = true; trip(); }
    else if (p.hold) { S.proj.push({ kind: p.hold, x: p.x + 8 * p.face, y: p.y + (p.hold === "ball" ? 4 : 18), vx: 210 * p.face + vx * .5, vy: p.hold === "ball" ? 30 : 45, b: 0, t: 0 }); p.hold = null; p.threw = true; }
    else p.threw = false;
  }
  atkEdge = false;
  if (p.atk > 0) p.atk -= dt;
  if (!K.jump && p.vy > 80) p.vy = 80;           // short hop when released early
  p.vy -= GRAV * dt; p.y += p.vy * dt;
  if (p.y <= 0) { if (!p.onG && p.vy < -200) dust(p.x); p.y = 0; p.vy = 0; p.onG = true; }
  p.x = clamp(p.x + vx * dt, 10, END + 300);
  if (p.onG && vx !== 0) p.dist += Math.abs(vx * dt);
  if (p.inv > 0) p.inv -= dt;
  p.blink -= dt; if (p.blink < -3.2) p.blink = 0.12;
  // idle long enough and Red starts talking
  const busy = K.left || K.right || K.jump || K.duck || K.pee || p.atk > 0;
  p.idle = busy ? Math.min(p.idle, 0) : p.idle + dt;
  if (p.idle > 4.5 && bubbles[0].t <= 0) { redSays(quote()); p.idle = -9; }

  // swing connects
  if (p.atk > 0.06 && !p.threw) {
    const reach = p.face > 0 ? { l: p.x + 2, r: p.x + 19, b: p.y + 3, t: p.y + 30 } : { l: p.x - 19, r: p.x - 2, b: p.y + 3, t: p.y + 30 };
    for (const o of S.obs) if (!o.dead && !o.flung && overlap(reach, o)) fling(o, p.face);
  }
  // thrown props
  for (const q of S.proj) {
    q.t += dt; q.vy -= GRAV * 0.7 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    const box = { l: q.x - 3, r: q.x + 3, b: q.y, t: q.y + 5 };
    for (const o of S.obs) if (!o.dead && !o.flung && q.vx && overlap(box, o)) { if (!fling(o, Math.sign(q.vx))) {} q.vx *= -0.3; q.vy = Math.max(q.vy, 60); break; }
    if (q.y <= 0) {
      if (q.kind === "ball" && q.b < 3 && Math.abs(q.vx) > 30) { q.y = 0; q.vy = Math.max(60, -q.vy * 0.55); q.vx *= 0.75; q.b++; }
      else { q.done = true; S.props.push({ kind: q.kind, x: q.x }); }
    }
  }
  S.proj = S.proj.filter(q => !q.done && Math.abs(q.x - S.camX) < W * 2);
  // pick up
  if (!p.hold && p.onG && !p.pee && p.atk <= 0) {
    const i = S.props.findIndex(q => Math.abs(q.x - p.x) < 7);
    if (i >= 0) { p.hold = S.props[i].kind; S.props.splice(i, 1); }
  }
  // comic characters speak once when Red walks by
  for (const n of S.npcs) if (!n.said && n.line && Math.abs(n.x - p.x) < 34) { n.said = true; say(n.line, n.x, NS[n.kind].height + 4, 2.4); }

  // camera
  S.camX += (clamp(p.x - 120, 0, END + 320 - W) - S.camX) * Math.min(1, dt * 8);

  // world titles + HUD
  const wi = Math.min(NW - 1, Math.floor(p.x / LEN));
  if (p.x < END) { $("world").textContent = SERIES[WORLDS[wi].key].name; if (!S.seen.has(wi) && p.x - wi * LEN > 8) { S.seen.add(wi); showTitle(WORLDS[wi].title); } }
  else $("world").textContent = "The End";
  for (const c of S.captions) if (!c.shown && p.x > c.x) { c.shown = true; showCaption(c.text); }

  // obstacles
  const hb = hitbox(p);
  for (const o of S.obs) {
    if (o.dead) continue;
    if (!o.active && o.x - S.camX < W + 6) o.active = true;
    if (o.flung) { o.x += o.vx * dt; o.y += o.vy * dt; o.vy -= GRAV * 0.6 * dt; if (o.y < -40 || Math.abs(o.x - S.camX) > W * 2) o.dead = true; continue; }
    if (o.active && o.vx) { o.x += o.vx * dt; if (o.x + o.w < S.camX - 60) o.dead = true; }
    if (p.inv > 0) continue;
    if (overlap(hb, o)) {
      p.inv = 1.3; p.kb = 0.16; p.vy = Math.max(p.vy, 120); p.onG = false;
      if (bubbles[0].t <= 0) redSays(quote());
    }
  }

  // pee targets
  for (const tg of S.targets) {
    tg.t += dt;
    if (tg.vx) tg.x += tg.vx * dt;
    if (p.pee && !tg.done && Math.abs(tg.x - p.x) < 36) {
      tg.wet += dt;
      if (tg.wet > 0.9) { tg.done = true; tg.t = 0; S.score++; $("score").textContent = `${S.score} / ${NW}`; react(tg); }
    }
  }
  // puddles while peeing with no target nearby
  if (p.pee && Math.floor(S.t * 30) % 2 === 0) {
    let pd = S.puddles.find(q => Math.abs(q.x - p.x) < 4 && q.age < 5);
    if (!pd) { pd = { x: p.x, w: 2, age: 0 }; S.puddles.push(pd); }
    pd.w = Math.min(16, pd.w + dt * 14); pd.age = 0;
  }
  S.puddles.forEach(q => q.age += dt); S.puddles = S.puddles.filter(q => q.age < 7);
  S.fx.forEach(f => { f.t += dt; f.x += (f.vx || 0) * dt; f.y += (f.vy || 0) * dt; }); S.fx = S.fx.filter(f => f.t < f.life);
  if (S.card > 0) S.card -= dt;
  if (S.trip > 0 && (S.trip -= dt) <= 0) stage.classList.remove("trip");

  // nearby panel
  S.near = S.panels.find(q => Math.abs(q.x - p.x) < 30) || null;
  $("lookBtn").classList.toggle("ready", !!S.near);

  // ending
  if (!S.ended && p.x > END + 110) {
    S.ended = true;
    setTimeout(() => {
      const n = S.score;
      $("endStats").textContent = n === NW ? `You peed on all ${NW} things. Red is proud of you.` :
        `You found ${n} of ${NW} things to pee on. ${n ? "Respectable." : "Very restrained."} Walk again to find the rest.`;
      $("end").classList.add("on"); for (const k in K) K[k] = false;
    }, 700);
  }

  // overlay timers
  if (capTimer > 0 && (capTimer -= dt) <= 0) hideCaption();
  if (titleTimer > 0 && (titleTimer -= dt) <= 0) $("title").classList.remove("on");
  bubbles.forEach(b => { if (b.t > 0 && (b.t -= dt) <= 0) b.el.classList.remove("on"); });
}

  if (tg.kind === "bush") { say("it's thriving.", tg.x, 22, 1.8); }
  if (tg.kind === "patch") { say("...whoa.", tg.x, 30, 1.8); }

}

  R(C.ink, x, y + 5, 40, 10); R(C.ink, x + 7, y, 25, 7);
  R(pk, x + 1, y + 6, 38, 8); R(pkD, x + 1, y + 12, 38, 2);
  R(pk, x + 8, y + 1, 23, 6);
  R("#2a2530", x + 10, y + 2, 8, 4); R("#2a2530", x + 20, y + 2, 9, 4);
  R("#eee", x + 13, y + 2, 1, 4); R("#eee", x + 24, y + 2, 1, 4);
  R(C.ink, x + 16, y - 3, 7, 4); R(pkL, x + 17, y - 2, 5, 2); R(C.ink, x + 17, y - 1, 5, 1);
  const bounce = mode === "drive" ? (Math.floor(t * 10) % 2) : 0;
  [5, 29].forEach(wx => { R(C.ink, x + wx, y + 12 + bounce * 0, 7, 5); R("#ddd", x + wx + 1, y + 13, 5, 3); });
  if (mode === "sleep") { R(C.ink, x + 3, y + 9, 4, 1); R(C.ink, x + 2, y + 8, 1, 1); }
  else { R("#fff", x + 2, y + 7, 5, 4); R(C.ink, x + 2 + (mode === "awake" ? 2 : 0), y + 8, 2, 2); R(C.ink, x + 2, y + 6, 1, 1); R(C.ink, x + 4, y + 5, 1, 1); R(C.ink, x + 6, y + 6, 1, 1); }
  R(C.ink, x + 8, y + 11, 3, 1);
  if (mode === "awake") R("#ff6fa8", x + 8, y + 9, 3, 1);
}
function drawBall(x, y, t) { R(C.ink, x, y + 1, 7, 5); R(C.ink, x + 1, y, 5, 7); R("#f2f2ee", x + 1, y + 1, 5, 5); const f = Math.floor(t * 12) % 2; R(C.ink, x + 2 + f, y + 2 + f, 2, 2); }
function drawSign(x, y, t) { const b = Math.floor(t * 8) % 2; R("#3a2a1c", x + 5, y + 7 - b, 1, 3); R(C.ink, x, y - b, 12, 8); R(C.paper, x + 1, y + 1 - b, 10, 6); R(C.red, x + 3, y + 1 - b, 6, 6); R(C.paper, x + 4, y + 2 - b, 4, 4); R("#E3A9E0", x + 4, y + 3 - b, 4, 2); R(C.red, x + 5, y + 3 - b, 1, 1); R(C.red, x + 6, y + 4 - b, 1, 1); }
function drawArrowL(x, y) { R("#9a9a9a", x, y + 1, 2, 2); R(C.ink, x + 1, y, 1, 4); R("#6b4425", x + 2, y + 1, 11, 1); R("#e2c23a", x + 12, y, 3, 1); R("#e2c23a", x + 12, y + 2, 3, 1); }
function drawStuck(x, y) { [[1, 0], [5, -1], [8, 1]].forEach(([dx, dy]) => { R("#6b4425", x + dx, y + 2 + dy, 1, 9 - dy); R("#e2c23a", x + dx - 1, y + dy, 3, 3); }); R("#1d521b", x - 1, y + 9, 13, 2); }
function drawFire(x, y, t, big) {
  const s = big ? 2 : 1, f = Math.floor(t * 9) % 3;
  R("#5b3412", x, y + 9 * s, 10 * s, 3 * s); R(C.ink, x + 2 * s, y + 9 * s, 1, 3 * s);
  R("#e2541c", x + 2 * s, y + (3 + f % 2) * s, 6 * s, (6 - f % 2) * s); R("#f39a2a", x + 3 * s, y + (5 + (f === 2)) * s, 4 * s, (4 - (f === 2)) * s); R("#ffe17a", x + 4 * s, y + 7 * s, 2 * s, 2 * s);
  R("#e2541c", x + (3 + f) * s, y + (1 + (f % 2)) * s, 2 * s, 2 * s);
}
function drawBat(x, y, t) { const up = Math.floor(t * 10) % 2; R(C.ink, x + 4, y + 2, 3, 3); R("#ff5a3a", x + 4, y + 3, 1, 1);
  if (up) { R(C.ink, x, y, 4, 2); R(C.ink, x + 7, y, 4, 2); } else { R(C.ink, x, y + 3, 4, 2); R(C.ink, x + 7, y + 3, 4, 2); } }
function drawCase(x, y) { R(C.ink, x, y + 1, 9, 6); R("#7a4522", x + 1, y + 2, 7, 4); R(C.ink, x + 3, y, 3, 1); R("#c9a24a", x + 4, y + 3, 1, 1); }

function drawObs(o) {
  const x = Math.round(o.x - S.camX), y = Math.round(G - o.y - o.h);
  if (x < -60 || x > W + 10) return;
  const t = S.t;
  switch (o.type) {
    case "taxi": drawTaxi(x, y, "drive", t); break;
    case "case": drawCase(x, y); break;
    case "sign": drawSign(x, y, t); break;
    case "ball": case "hiball": drawBall(x, y, t); break;
    case "volley": for (let i = 0; i < 3; i++) drawArrowL(x + i * 16, y + (i % 2)); break;
    case "stuck": drawStuck(x, y); break;
    case "fire": drawFire(x, y, t + o.x); break;
    case "bat": drawBat(x, y + Math.round(Math.sin(t * 6 + o.x) * 1.5), t); break;
    case "mush": ctx.drawImage(NS.mush, x - 1, y - 1 - (o.flung ? 0 : Math.floor(t * 8 + o.x) % 2)); break;
    case "frisbee": R(C.ink, x, y, 10, 3); R("#ff5fa2", x + 1, y + 1, 8, 1); R(Math.floor(t * 12) % 2 ? "#ffd1e6" : "#ff5fa2", x + 3, y, 3, 1); break;
  }
}
function drawTarget(tg) {
  const x = Math.round(tg.x - S.camX); if (x < -60 || x > W + 60) return;
  const t = S.t;
  if (tg.kind === "parked") drawTaxi(x - 20, G - 16, tg.done ? (tg.vx ? "drive" : "awake") : "sleep", t);
  if (tg.kind === "parked" && !tg.done && Math.floor(t * 1.5) % 2) { R(C.paper, x + 2, G - 26, 3, 1); R(C.paper, x + 4, G - 25, 1, 1); R(C.paper, x + 2, G - 24, 3, 1); }
  if (tg.kind === "flag") { R("#ddd", x, G - 24, 1, 24); const w = Math.floor(t * 4) % 2; R("#f2a91f", x + 1, G - 24, 7 - w, 3); R("#f2a91f", x + 1, G - 21, 5 - w, 2); R("#c46f12", x + 1, G - 24, 1, 5); }
  if (tg.kind === "bush") { R(C.ink, x - 9, G - 12, 18, 12); R("#2f7a2b", x - 8, G - 11, 16, 11); R("#3c9636", x - 6, G - 13, 9, 4); R(C.ink, x - 7, G - 14, 11, 1);
    if (tg.done) [[-5, -9], [2, -11], [5, -6], [-2, -5], [-6, -3]].forEach(([dx, dy], i) => { if (tg.t > i * .15) { R("#ff8fc4", x + dx, G + dy, 2, 2); R("#ffe17a", x + dx, G + dy, 1, 1); } }); }
  if (tg.kind === "patch") { const big = tg.done && tg.t > 0.3, im = big ? NS.mush : NS.shroom;
    [-9, -2, 5, 11].forEach((dx, i) => ctx.drawImage(im, x + dx - (big ? 4 : 2), G - im.height + 1 - (big && Math.floor(t * 3 + i) % 2 ? 1 : 0))); }
  if (tg.kind === "campfire") { if (!tg.done) drawFire(x - 10, G - 24, t, true); else { R("#5b3412", x - 10, G - 6, 20, 6); R("#2b2b2b", x - 6, G - 7, 12, 2); } }
}

function drawProp(kind, x, y, face) {   // x,y = bottom-centre in screen space
  const im = NS[face < 0 ? kind + "L" : kind]; ctx.drawImage(im, Math.round(x - im.width / 2), Math.round(y - im.height + 1));
}
function drawRed() {
  const p = S.p, sx = Math.round(p.x - S.camX), gy = G - Math.round(p.y);
  if (p.inv > 0 && Math.floor(p.inv * 14) % 2) return;
  const walking = (K.left || K.right) && p.onG && p.kb <= 0;
  const f = WALK[Math.floor(p.dist / 7) % 4];
  let key;
  if (p.pee) key = p.peeT > 0.35 ? "backLow" : "back";
  else if (p.duck) key = "duck";
  else if (p.atk > 0) key = "attack";
  else if (p.hold) key = !p.onG ? "carryJ" : walking ? "carry" + f.toUpperCase() : "carry";
  else if (!p.onG) key = "jump";
  else if (walking) key = f;
  else key = p.blink > 0 ? "blink" : "stand";
  const back = key.startsWith("back"), spr = SPR[back || p.face > 0 ? key : key + "L"];
  const left = back ? sx - Math.floor(spr.width / 2) : p.face > 0 ? sx - 9 : sx - (spr.width - 9);
  const top = gy - spr.height + 1;
  R("rgba(0,0,0,.28)", sx - 6 + Math.min(3, p.y / 12), G, 12 - Math.min(6, p.y / 8), 1);
  ctx.drawImage(spr, left, top);
  if (p.hold && !p.pee) {   // prop in hand
    const hx = p.duck ? (p.face > 0 ? left + 17 : left + spr.width - 17) : (p.face > 0 ? left + 16 : left + spr.width - 16);
    drawProp(p.hold, hx, p.duck ? top + 9 : top + 18, p.face);
  }
}
function drawNpc(n) {
  const im = NS[n.face < 0 ? n.kind + "L" : n.kind], x = Math.round(n.x - S.camX - im.width / 2);
  if (x < -40 || x > W + 40) return;
  const bob = (n.kind === "speaker" || n.kind === "protester") ? (Math.floor(S.t * 2 + n.x) % 2) : 0;
  ctx.drawImage(im, x, G - im.height + 1 - bob);
}
function drawProps() {
  for (const q of S.props) { const x = q.x - S.camX; if (x < -20 || x > W + 20) continue; drawProp(q.kind, x, G, 1);
    if (Math.floor(S.t * 3) % 2) { const h = NS[q.kind].height; R(C.paper, x - 2, G - h - 6, 5, 1); R(C.paper, x - 1, G - h - 5, 3, 1); R(C.paper, x, G - h - 4, 1, 1); } }
  for (const q of S.proj) { const x = q.x - S.camX; const im = NS[q.kind];
    ctx.save(); ctx.translate(Math.round(x), Math.round(G - q.y - im.height / 2)); ctx.rotate(Math.round(q.t * 10) * Math.PI / 2 * Math.sign(q.vx || 1));
    ctx.drawImage(im, -Math.floor(im.width / 2), -Math.floor(im.height / 2)); ctx.restore(); }
}

function drawPee() {
  const p = S.p; if (!p.pee) return;
  const tg = S.targets.find(t => !t.done && Math.abs(t.x - p.x) < 36);
  const sx = p.x - S.camX, sy = G - 9;
  if (tg) {
    const tx = tg.x - S.camX, ty = G - (tg.kind === "flag" ? 4 : tg.kind === "bush" ? 7 : 6);
    for (let i = 0; i <= 18; i++) { const u = i / 18; if ((i + Math.floor(S.t * 30)) % 3 === 0) continue;
      R(i % 2 ? C.pee : C.peeD, sx + (tx - sx) * u, sy + (ty - sy) * u - Math.sin(u * Math.PI) * 9, 1, 1); }
    if (Math.floor(S.t * 20) % 2) R(C.pee, tx - 1, ty, 3, 1);
  } else {
    const f = Math.floor(S.t * 24) % 3;
    for (let i = 0; i < 4; i++) R(C.pee, sx + (i % 2), sy + 2 + i * 2 + f % 2, 1, 1);
  }
}
function drawPuddles() { for (const q of S.puddles) { const a = clamp(1 - q.age / 7, 0, 1); ctx.globalAlpha = a; const x = Math.round(q.x - S.camX - q.w / 2); R(C.peeD, x, G, Math.round(q.w), 1); R(C.pee, x + 1, G, Math.max(0, Math.round(q.w) - 2), 1); ctx.globalAlpha = 1; } }
function drawCloudHand() {
  if (!(S.trip > 0)) return;
  const k = clamp((9 - S.trip) / 2.5, 0, 1), out = clamp(S.trip / 1.5, 0, 1), d = Math.min(k, out);
  const tx = S.p.x - S.camX, ty = G - 44 - S.p.y, sx = tx - 150, sy = -30;
  ctx.globalAlpha = 0.92 * d; ctx.fillStyle = "#f2f2ef";
  const ex = sx + (tx - sx) * (0.55 + 0.45 * k) - 6, ey = sy + (ty - 18 - sy) * (0.55 + 0.45 * k);
  for (let i = 0; i <= 14; i++) { const u = i / 14, x = sx + (ex - sx) * u, y = sy + (ey - sy) * u + Math.sin(u * 3 + S.t) * 2;
    ctx.beginPath(); ctx.arc(Math.round(x), Math.round(y), 9 - u * 2, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(Math.round(ex + 4), Math.round(ey + 4), 9, 0, 7); ctx.fill();
  R("#f2f2ef", ex + 5, ey + 8, 4, 10 * k + 4);
  ctx.globalAlpha = 0.35 * d; R("#9a9a9a", ex - 2, ey + 9, 10, 2); R("#9a9a9a", ex + 8, ey + 8, 1, 10 * k + 4);
  ctx.globalAlpha = 1;
}
function drawFx() {
  for (const f of S.fx) { if (f.t < 0) continue; const x = f.x - S.camX, y = G - f.y;
    if (f.kind === "steam") { ctx.globalAlpha = clamp(1 - f.t / f.life, 0, 1) * .8; R("#d6d6d6", x, y, 3, 2); ctx.globalAlpha = 1; }
    if (f.kind === "dust") R("rgba(220,220,220,.7)", x, y, 2, 1);
    if (f.kind === "spark") R(["#c86ed2", "#f3d23b", "#6eaae6"][Math.floor(f.t * 20 + f.x) % 3], x, y, 1, 1);
    if (f.kind === "pow") { const r = 2 + Math.round(f.t * 24); R(C.paper, x - r, y, r * 2 + 1, 1); R(C.paper, x, y - r, 1, r * 2 + 1); R(C.paper, x - r + 2, y - r + 2, 1, 1); R(C.paper, x + r - 2, y - r + 2, 1, 1); R(C.paper, x - r + 2, y + r - 2, 1, 1); R(C.paper, x + r - 2, y + r - 2, 1, 1); } }
  if (S.card > 0) { const x = Math.round(S.p.x - S.camX) + 8, y = G - 52 - Math.round(S.p.y); R(C.ink, x, y, 7, 10); R("#f5d32a", x + 1, y + 1, 5, 8); R("#dcdcdc", x + 2, y + 9, 1, 4); }
}

/* ============ frame ============ */
function render() {
  const cam = S.camX;
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  WORLDS.forEach((w, i) => {
    const a = i * LEN - cam, b = a + LEN;
    if (b < 0 || a > W) return;
    ctx.save(); ctx.beginPath(); ctx.rect(Math.max(0, Math.round(a)), 0, Math.min(W, Math.round(b)) - Math.max(0, Math.round(a)), H); ctx.clip();
    BG[w.key](S.t);
    ctx.restore();
  });
  endPage();
  S.panels.forEach(drawPanel);
  for (let i = 1; i <= NW; i++) gutter(i * LEN);
  drawPuddles();
  S.npcs.forEach(drawNpc);
  S.targets.forEach(drawTarget);
  drawProps();
  drawPee();
  S.obs.forEach(o => { if (!o.dead) drawObs(o); });
  drawRed();
  drawCloudHand();
  drawFx();
  // panel border around the whole screen (comic page feel)
  R(C.ink, 0, 0, W, 2); R(C.ink, 0, H - 2, W, 2); R(C.ink, 0, 0, 2, H); R(C.ink, W - 2, 0, 2, H);

  const n = Math.max(1, Math.ceil(screen.width / W));
  if (up.width !== W * n) { up.width = W * n; up.height = H * n; }
  uctx.imageSmoothingEnabled = false; uctx.clearRect(0, 0, up.width, up.height); uctx.drawImage(buf, 0, 0, up.width, up.height);
  sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = "high";
  sctx.drawImage(up, 0, 0, screen.width, screen.height);

  // HTML overlays that follow world positions
  const sc = 100 / W, scy = 100 / H;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  bubbles.forEach(b => { if (b.t <= 0) return; const x = b.follow ? S.p.x : b.x, y = b.follow ? S.p.y + (S.p.duck ? 18 : b.y) : b.y;
    const bw = b.el.offsetWidth, px = (x - cam) / W * sw, lx = clamp(px, bw / 2 + 8, sw - bw / 2 - 8);
    b.el.style.left = lx + "px"; b.el.style.top = Math.max(b.el.offsetHeight + 10, (G - y) / H * sh) + "px";
    b.el.style.setProperty("--tail", clamp(50 + (px - lx) / bw * 100, 12, 88) + "%"); });
  const pr = $("prompt");
  if (S.near && S.running && !S.paused) { pr.style.left = ((S.near.x - cam) * sc) + "%"; pr.style.top = (25 * scy) + "%"; pr.textContent = isTouch ? "Tap look" : "L to look"; pr.classList.add("on"); }
  else pr.classList.remove("on");
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (S.running && !S.paused && !S.ended) update(dt);
  else { S.t += dt; S.fx.forEach(f => f.t += dt); }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// load panels (game can start before all finish)
const nums = WORLDS.flatMap(w => w.panels.map(p => p[0]));
Promise.all(nums.map(loadPanel)).then(() => { $("loading").style.display = "none"; });
})();
</script>
